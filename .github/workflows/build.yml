name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log

      - name: Riassunto errori
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|Could not|Execution failed|> " build.log | head -60 > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)
          echo "::error title=Errori di compilazione::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: SpesaRadar-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Pubblica APK (link diretto)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SpesaRadar.apk
          VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          gh release delete ultima --yes --cleanup-tag 2>/dev/null || true
          gh release create ultima SpesaRadar.apk --title "SpesaRadar $VER" --notes "Ultima versione compilata." --latest
